name: Publish Astro site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Test content
        run: npm run test:content

      - name: Generate Astro types
        run: npx astro sync

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build static site
        run: npm run build
        env:
          ASTRO_BASE_PATH: /avalon-compendio
          ASTRO_SITE_URL: https://leovanelli.github.io

      - name: Check built links
        run: npm run check:links
        env:
          ASTRO_BASE_PATH: /avalon-compendio

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
